<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My App</title>
<style>
  :root { --bg:#f6f5f1; --ink:#1c1917; --acc:#a16207; --card:#fff; --line:#e4e1dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121110; --ink:#f5f5f4; --acc:#f2c14e; --card:#1c1b19; --line:#34312d; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,'Segoe UI',sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px; }
  #updateBar { display:none; position:sticky; top:0; padding:10px 16px; background:var(--acc); color:#fff; align-items:center; justify-content:space-between; gap:8px; }
  #updateBar.show { display:flex; }
  button { padding:6px 14px; border-radius:8px; border:1px solid #fff; background:transparent; color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div id="updateBar"><span id="updateMsg"></span><button id="btnUpdate">تحديث الآن</button></div>
<main>
  <h1>اسم التطبيق</h1>
  <p>ابدأ من هنا. انسخ هذا المجلد باسم جديد داخل apps/ وأضف app.json.</p>
  <p style="opacity:.6;font-size:12px" id="verInfo"></p>
</main>
<script>
"use strict";
// رقم الإصدار: يختمه  python3 apps/stamp-version.py apps/<الاسم>  (لا تعدّله يدوياً)
const APP_VERSION = "dev";
document.getElementById("verInfo").textContent = "v" + APP_VERSION;

// اكتشاف إصدار أحدث على الخادم (يعمل عند الاستضافة فقط)
let newVersion = null;
const checkUpdate = async () => {
  if (location.protocol === "file:" || newVersion) return;
  try {
    const r = await fetch("version.json?_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.version && j.version !== APP_VERSION) {
      newVersion = j.version;
      document.getElementById("updateMsg").textContent = "يتوفر إصدار جديد (" + j.version + ")";
      document.getElementById("updateBar").classList.add("show");
    }
  } catch (e) { /* بلا اتصال */ }
};
document.getElementById("btnUpdate").addEventListener("click", () => location.replace(location.pathname + "?v=" + encodeURIComponent(newVersion)));
checkUpdate(); setInterval(checkUpdate, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
</script>
</body>
</html>
