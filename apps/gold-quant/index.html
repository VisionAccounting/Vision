"help.badge":"حالة السعر الحي: أخضر = حديث، أصفر = قديم، أحمر = تعذر الاتصال. العدّاد يبيّن موعد التحديث التالي.",
"upd.msg":"يتوفر إصدار جديد من البرنامج ({v}).",
"upd.btn":"تحديث الآن",
"ver.info":"الإصدار {v}",
"help.tab.dashboard":"<b>الغرض:</b> نظرة سريعة على سعر الذهب الآن، وهل هو مرتفع أم مناسب.<ul><li>اختر <b>الدولة والوزن والعيار</b> من القوائم أعلاه: كل ما في الشاشة يتبعها.</li><li>البطاقات تعرض السعر بعملتك ووحدتك، وبالوحدة الأخرى، والسعر العالمي.</li><li>الرسم يوضح حركة السعر في المدة التي تختارها.</li><li>بطاقة الإشارة تلخّص: شراء أو حياد أو بيع، مع الأسباب.</li></ul>",
"help.tab.forecast":"<b>الغرض:</b> تقدير المجال الذي قد يتحرك فيه السعر غداً. لا أحد يعرف السعر بالتحديد، لذلك نعرض <b>نطاقاً</b> بدل رقم واحد. اضغط «تحديث المحاكاة» لإعادة الحساب بعد تغيير أي إعداد.",
"help.tab.fair":"<b>الغرض:</b> هل السعر الحالي أعلى أم أقل مما تبرره الظروف الاقتصادية (الفائدة الحقيقية وقوة الدولار والمخاطر)؟ النموذج يحسب «قيمة عادلة» ثم يقارنها بالسعر. المعاملات الافتراضية أمثلة فقط؛ استبدلها بمعاملاتك أو احسبها من شاشة الدراسات الإحصائية.",
"help.tab.research":"<b>الغرض:</b> مختبر يفحص بيانات الذهب التاريخية ليعرف طبيعة حركته: هادئة أم متقلبة؟ تميل للاستمرار أم للعودة؟ نتائجه تحسّن النطاقات في شاشة التنبؤ. لا تحتاج أن تفهم المعادلات: اقرأ عبارة <b>النتيجة</b> وملخص التفسير في آخر الصفحة.",
"help.tab.data":"<b>الغرض:</b> مخزن بياناتك، وكل الحسابات تُبنى على الصفوف هنا. يمكنك تحميل سنوات من البيانات تلقائياً، أو إضافة يوم يدوياً، أو استيراد ملف CSV. البيانات تبقى على جهازك فقط.",
"help.tab.settings":"<b>الغرض:</b> ضبط المصنعية وطريقة حساب التقلب وفترة التحديث التلقائي. إن لم تكن متأكداً اترك القيم الافتراضية، فهي مناسبة لمعظم الحالات.",
"help.markets":"اختر <b>الدولة</b> من القائمة: كل الأسعار والتحليلات والرسوم تُعرض بعملتها (ريال سعودي SAR، جنيه مصري EGP، أو دولار USD للسعر العالمي). اختر أيضاً <b>الوزن</b> (جرام أو أونصة) و<b>العيار</b> (24 هو الأنقى ثم 22 و21 و18). شريط الصرف في أعلى الشاشة يعرض الذهب والعملات مقابل الدولار دائماً.",
"help.priceChart":"الخط يمثّل سعر الذهب بعملة ووحدة وعيار العرض التي اخترتها، يوماً بعد يوم، وارتفاعه يعني ارتفاع السعر. اختر المدة من الأزرار (30 يوماً، 90 يوماً، سنة، الكل). مرّر إصبعك أو المؤشر فوق الخط لترى سعر أي يوم. في السوق المحلي يتأثر الخط أيضاً بحركة سعر الصرف.",
"help.signal":"إشارة بسيطة تجمع عدة أدلة:<ul><li>هل السعر <b>أعلى أو أقل من قيمته العادلة</b>؟</li><li>هل خرج السعر اليوم عن المجال المتوقع أمس؟ هذا قد يعني مبالغة في الصعود أو الهبوط.</li><li>انحيازك اليدوي (mu) إن وضعته.</li></ul>كل سبب يضيف نقطة أو ينقصها: مجموع +1 فأكثر = شراء، −1 فأقل = بيع، وما بينهما حياد. <b>هذه قراءة إحصائية وليست نصيحة استثمارية.</b>",
"help.mini":"<b>التقلب اليومي:</b> كم يتحرك السعر عادةً في اليوم (0.8% تعني حركة نموذجية بهذا القدر). <b>نطاق الثقة 80%:</b> المجال الذي نتوقع أن يقع فيه سعر الغد في 8 مرات من كل 10. <b>البيانات المخزنة:</b> عدد الأيام المستخدمة في الحساب؛ كلما زادت صارت التقديرات أوثق.",
"help.bands":"الجدول يرتّب سيناريوهات الغد من الأدنى للأعلى. <b>P50</b> هو الوسط (نصف السيناريوهات أعلى ونصفها أدنى). <b>P10 وP90</b> يحيطان بـ 80% من الحالات، و<b>P5 وP95</b> يحيطان بـ 90%. مثال: إذا كان P95 يساوي 4,400 فالسعر تجاوز هذا الرقم في 5 سيناريوهات فقط من كل 100.",
"help.probs":"احتمالات من المحاكاة: أن يتجاوز السعر الحد الأعلى (P90)، أو يكسر الحد الأدنى (P10)، أو يغلق فوق سعر اليوم، أو يتجاوز سعراً تحدده أنت في الخانة بالأعلى. الأرقام الصغيرة تحت كل احتمال تقارن بما حدث فعلاً في الماضي بعد تشغيل «اختبار التغطية».",
"help.box":"الصندوق الفاتح العريض = المجال الذي يقع فيه السعر بنسبة 90%، والأضيق الأغمق = 80%، والخط الداكن = الوسيط، والمعيّن الأسود = السعر الحالي. إذا كان المعيّن قريباً من منتصف الصناديق فالسعر ضمن المتوقع. كلما اتسعت الصناديق زاد عدم اليقين.",
"help.dist":"كل عمود يعدّ عدد السيناريوهات التي انتهت عند سعر معيّن من بين آلاف السيناريوهات. الشكل الجرسي يعني أن الأسعار القريبة من الوسط أكثر احتمالاً، والأطراف البعيدة أقل احتمالاً لكنها ممكنة.",
"help.local":"نفس النطاقات محوّلة إلى كل عيار (24 هو الأنقى، و22 و21 و18 أقل نقاءً) بعملة ووحدة العرض. العمود الأول سعر اليوم، والباقي الحدود المتوقعة للغد. الأسعار تشمل المصنعية التي تحددها في الإعدادات.",
"help.backtest":"هنا نختبر أمانة النموذج على الماضي: لو استخدمنا الطريقة نفسها كل يوم، كم مرة وقع السعر الفعلي داخل المجال (80%)؟ المفروض قرابة 80%.<ul><li><b>اختبار التغطية:</b> يحسب النسبة ويقترح تصحيحاً إن ابتعدت كثيراً.</li><li><b>اختبار Christoffersen:</b> يتحقق أن الأخطاء لا تأتي متتالية (متكتلة)، فتكتلها يعني أن النموذج يتأخر عن تغيّر السوق.</li></ul>النقاط الحمراء على الرسم هي الأيام التي خرج فيها السعر عن المجال.",
"help.fvModel":"المعادلة تقول: القيمة العادلة = ثابت + أثر الفائدة الحقيقية + أثر الدولار + أثر مشتريات البنوك المركزية + أثر المخاطر. المعاملات β تحدد قوة كل أثر وإشارته (الإشارة السالبة تعني أن ارتفاع العامل يخفض الذهب). القيم الأولية أمثلة؛ استبدلها بقيمك أو اضغط «تطبيق» من شاشة الدراسات الإحصائية.",
"help.fvRes":"<b>نسبة العدالة = السعر السوقي ÷ القيمة العادلة.</b> أكبر من 1.15: السعر مبالغ فيه. بين 0.85 و1.15: عادل. أقل من 0.85: أقل من قيمته. النسبة تقول إن كان السعر بعيداً عن المنطق الاقتصادي، ولا تقول متى سيعود.",
"help.hist":"الزر يجلب أسعار الذهب والصرف ومؤشر الدولار والتقلب والفائدة الحقيقية لسنوات من مصادر مجانية، ويدمجها مع بياناتك دون حذف شيء. كلما زادت البيانات صارت التقديرات الإحصائية أدق. إذا فشل مصدر يجرّب التطبيق الذي يليه.",
"help.manual":"إذا تعذر الجلب الآلي اكتب السعر وسعري الصرف بنفسك واضغط «تطبيق»: يُستخدم فوراً كسعر حالي في كل الشاشات. مناسب للطوارئ أو للتجربة.",
"help.rowform":"أضف يوماً واحداً يدوياً (التاريخ والسعر على الأقل). الحقول الاختيارية (العائد الحقيقي، الدولار، VIX) تُستخدم في شاشتي الدراسات والتقييم العادل.",
"help.table":"كل صف هو يوم تداول. عمود «العائد اليومي» هو نسبة تغيّر السعر عن اليوم السابق (أخضر صعود وأحمر هبوط). تُعرض أحدث 250 صفاً، والبيانات كلها مخزنة على جهازك.",
"help.params":"<ul><li><b>lambda:</b> سرعة استجابة التقلب للأخبار الجديدة (0.94 معيار شائع؛ الأقل أسرع).</li><li><b>nu:</b> سُمك الذيول: الأقل يعني توقع حركات حادة أكثر (قلّله إلى 3 في الأزمات).</li><li><b>مضاعف sigma:</b> يكبّر أو يصغّر النطاقات؛ يقترحه اختبار التغطية.</li><li><b>نموذج التقلب:</b> EWMA بسيط وسريع، وGARCH أدق مع بيانات طويلة (250 يوماً فأكثر).</li><li><b>أساس التحليل:</b> «عملة السوق» يحلل السعر المحلي كما يدفعه الناس فيتضمن حركة الصرف (مهم للجنيه المصري)، و«الدولار» يحلل الذهب وحده ثم يحوّل بسعر الصرف الحالي.</li></ul>",
"help.live":"اختر كل كم دقيقة يجلب البرنامج السعر تلقائياً. الشارة أعلى الشاشة تعرض آخر تحديث والعدّاد. الخيار الثاني يحفظ سعر اليوم كصف جديد ليبقى النموذج محدّثاً.",
"help.rs.dist":"كل عمود يعدّ الأيام حسب نسبة تغيّر السعر فيها. المنحنى المنقّط هو الشكل لو كانت الحركة «طبيعية»، والأزرق أقرب للواقع (ذيول أثقل). إذا علت الأعمدة عند الأطراف فوق المنقّط فالأيام الحادة أكثر مما يتوقعه النموذج البسيط. <b>VaR</b> هو أسوأ خسارة يومية متوقعة بثقة 95% أو 99%، و<b>CVaR</b> متوسط الخسارة في الأيام الأسوأ من ذلك، و<b>أقصى تراجع</b> أكبر هبوط من قمة إلى قاع.",
"help.rs.tests":"اختبارات تصف طبيعة الحركة:<ul><li><b>ADF:</b> هل السعر «يعود» لمستوى ثابت أم يتجوّل بحرية؟ (غير مستقر = يتجوّل)</li><li><b>Ljung–Box:</b> هل حركة اليوم تتأثر بالأيام السابقة؟ وعلى مربعات العوائد يكشف تجمّع التقلب.</li><li><b>نسبة التباين وهيرست:</b> هل تميل الحركة لاستمرار الاتجاه أم للارتداد؟</li></ul>العلامة ✓ تعني نتيجة «عادية»، والنقطة ● تعني ملاحظة تستحق الانتباه وليست خطأً.",
"help.rs.vol":"التقلب هو حجم حركة السعر. EWMA وGARCH طريقتان لتقديره من الأيام الأخيرة. <b>الاستمرارية</b> القريبة من 1 تعني أن الهدوء أو الاضطراب يدوم طويلاً، و<b>نصف العمر</b> هو عدد الأيام ليتلاشى نصف أثر أي صدمة. الرسم يوضح كيف يعود التقلب تدريجياً إلى مستواه الطويل (الخط الأزرق). «موقع التقلب الحالي» هو نسبة الأيام التاريخية التي كان تقلبها أقل من اليوم.",
"help.rs.fan":"المخروط يريك اتساع الاحتمالات مع الأيام القادمة: كلما ابتعدنا زاد الغموض فاتسع المخروط. الخط الداكن هو الوسيط، والمنطقة الأغمق تحوي 80% من السيناريوهات والأفتح 90%. اختر الأفق (من 5 أيام إلى 63 يوماً). السيناريوهات تُسحب من أيام فعلية من تاريخ الذهب، فتحافظ على طبيعته الحقيقية.",
"help.rs.reg":"نحاول تفسير سعر الذهب بالفائدة الحقيقية ومؤشر الدولار وVIX (مؤشر الخوف).<ul><li><b>β:</b> قوة أثر العامل. <b>t وp:</b> هل الأثر حقيقي؟ (p أقل من 0.05 يعني غالباً نعم).</li><li><b>R²:</b> نسبة ما فسّره النموذج (1 = كل شيء).</li><li><b>العلاقة الزائفة:</b> قد تبدو علاقة قوية بين سلسلتين تتجوّلان بحرية وهي مصادفة. لذلك نعرض انحدار التغيّرات أيضاً، واختبار Engle–Granger يقول إن كانت علاقة المستويات حقيقية.</li></ul>",
"help.rs.corr":"الارتباط رقم بين -1 و+1: قريب من +1 يعني أن الشيئين يتحركان معاً، وقريب من -1 يعني عكس بعضهما، وقريب من 0 لا علاقة. المصفوفة تقارن الذهب بالدولار والفائدة الحقيقية وVIX. الرسم يوضح كيف تتغير العلاقة عبر الزمن (نافذة 60 يوماً)؛ فالعلاقة ليست ثابتة.",
"help.rs.comp":"مؤشر واحد بين -1 و+1 يجمع عدة نظرات: الاتجاه العام، والزخم، وRSI (هل ارتفع السعر بسرعة؟)، والبعد عن المتوسط، ومستوى التقلب، والتقييم العادل. لكل عامل وزن ودرجة. فوق +0.25 إيجابي، وتحت -0.25 سلبي، وغير ذلك محايد. هو ملخص إحصائي وليس نصيحة.",
"help.rs.bt":"نختبر الطريقتين على الماضي دون «غش»: كل يوم نستخدم ما كان معروفاً حتى اليوم السابق فقط. الأقرب إلى 80% و90% هو الأمين أكثر. فرق صغير بين الطريقتين يعني أن الأبسط يكفي.",

"help.tab.dashboard":"<b>Purpose:</b> a quick look at the gold price right now, and whether it is high or reasonable.<ul><li>Pick the <b>country, weight and karat</b> from the lists above: everything on screen follows them.</li><li>The cards show the price in your currency and unit, in the other unit, and the global price.</li><li>The chart shows how the price moved over the period you choose.</li><li>The signal card sums up: buy, hold or sell, with the reasons.</li></ul>",
"help.tab.forecast":"<b>Purpose:</b> estimate the range the price may move in tomorrow. Nobody knows the exact price, so we show a <b>range</b> instead of one number. Press “Update simulation” to recompute after changing any setting.",
"help.tab.fair":"<b>Purpose:</b> is the current price higher or lower than economic conditions justify (real interest rates, dollar strength, risk)? The model computes a “fair value” and compares it with the price. Default coefficients are examples only; replace them with yours or estimate them in the Statistical Lab.",
"help.tab.research":"<b>Purpose:</b> a lab that studies historical gold data to learn how it behaves: calm or volatile? Does it tend to keep going or snap back? Its results improve the ranges in the Forecast tab. You do not need to understand the equations: read the <b>result</b> wording and the interpretive summary at the bottom.",
"help.tab.data":"<b>Purpose:</b> your data store; every calculation is built on the rows here. You can download years of data automatically, add a day by hand, or import a CSV file. Data stays on your device only.",
"help.tab.settings":"<b>Purpose:</b> set the making charge, the volatility method and the auto-refresh interval. If unsure, keep the defaults; they suit most cases.",
"help.markets":"Choose the <b>country</b> from the list: every price, analysis and chart is shown in its currency (Saudi riyal SAR, Egyptian pound EGP, or dollar USD for the global price). Also choose the <b>weight</b> (gram or ounce) and the <b>karat</b> (24 is the purest, then 22, 21 and 18). The rates strip at the top of the screen always shows gold and currencies against the dollar.",
"help.priceChart":"The line is the gold price in the display currency, unit and karat you chose, day by day; a rising line means a rising price. Choose the period with the buttons (30 days, 90 days, 1 year, All). Hover or touch the line to see any day's price. In a local market the line is also moved by the exchange rate.",
"help.signal":"A simple signal that combines several clues:<ul><li>Is the price <b>above or below its fair value</b>?</li><li>Did today's price leave yesterday's expected range? That can mean an overshoot up or down.</li><li>Your manual bias (mu), if you set one.</li></ul>Each reason adds or removes a point: +1 or more = buy, −1 or less = sell, in between = hold. <b>This is a statistical reading, not investment advice.</b>",
"help.mini":"<b>Daily volatility:</b> how much the price usually moves in a day (0.8% means a typical move of that size). <b>80% band:</b> the range where we expect tomorrow's price to land 8 times out of 10. <b>Stored data:</b> how many days feed the calculations; more days give firmer estimates.",
"help.bands":"The table lists tomorrow's scenarios from lowest to highest. <b>P50</b> is the middle (half the scenarios above, half below). <b>P10 and P90</b> enclose 80% of cases, <b>P5 and P95</b> enclose 90%. Example: if P95 is 4,400, the price exceeded that in only 5 of every 100 scenarios.",
"help.probs":"Probabilities from the simulation: that the price exceeds the upper bound (P90), breaks the lower bound (P10), closes above today's price, or exceeds a price you type in the box above. The small numbers underneath compare with what actually happened in the past after you run the “Coverage test”.",
"help.box":"The wide light box = where the price lands 90% of the time, the narrower dark box = 80%, the dark line = median, the black diamond = current price. If the diamond sits near the middle of the boxes, the price is within expectations. Wider boxes mean more uncertainty.",
"help.dist":"Each bar counts how many of the thousands of scenarios ended at a given price. A bell shape means prices near the middle are more likely, and far ends are less likely but possible.",
"help.local":"The same ranges converted to every karat (24 is the purest; 22, 21 and 18 are less pure) in the display currency and unit. The first column is today's price and the others are tomorrow's expected bounds. Prices include the making charge you set in Settings.",
"help.backtest":"Here we test the model's honesty on the past: if we used the same method every day, how often did the actual price land inside the range (80%)? It should be about 80%.<ul><li><b>Coverage test:</b> computes the rate and suggests a fix if it is far off.</li><li><b>Christoffersen test:</b> checks that misses do not come in streaks (clusters); clustering means the model lags behind market changes.</li></ul>Red dots on the chart are days when the price left the range.",
"help.fvModel":"The equation reads: fair value = constant + real-yield effect + dollar effect + central-bank-buying effect + risk effect. The β coefficients set each effect's strength and sign (a negative sign means a rise in that factor lowers gold). Starting values are examples; replace them with yours or press “Apply” in the Statistical Lab.",
"help.fvRes":"<b>Fairness ratio = market price ÷ fair value.</b> Above 1.15: overvalued. Between 0.85 and 1.15: fair. Below 0.85: undervalued. The ratio says whether the price is far from economic logic; it does not say when it will return.",
"help.hist":"The button fetches gold, FX, dollar index, volatility and real-yield history for years from free sources and merges it with your data without deleting anything. More data makes statistical estimates sharper. If one source fails, the app tries the next.",
"help.manual":"If automatic fetching fails, type the price and both FX rates yourself and press “Apply”: it is used immediately as the current price on every screen. Good for emergencies or testing.",
"help.rowform":"Add a single day by hand (date and price at least). The optional fields (real yield, dollar index, VIX) are used by the Statistical Lab and Fair Value screens.",
"help.table":"Each row is a trading day. The “Daily return” column is the price change versus the previous day (green up, red down). The latest 250 rows are shown; all data is stored on your device.",
"help.params":"<ul><li><b>lambda:</b> how fast volatility reacts to new moves (0.94 is a common standard; lower is faster).</li><li><b>nu:</b> tail thickness: lower expects more violent moves (set 3 in crises).</li><li><b>Sigma multiplier:</b> widens or narrows the ranges; the coverage test suggests it.</li><li><b>Volatility model:</b> EWMA is simple and fast, GARCH is sharper with long history (250+ days).</li><li><b>Analysis basis:</b> “Market currency” analyses the local price as people pay it, so it includes exchange-rate moves (important for the Egyptian pound); “USD” analyses gold alone and then converts at the current rate.</li></ul>",
"help.live":"Choose how often the app fetches the price automatically. The badge at the top shows the last update and the timer. The second option saves today's price as a new row so the model stays current.",
"help.rs.dist":"Each bar counts the days by their percentage price change. The dotted curve is the shape if moves were “normal”; the blue one is closer to reality (heavier tails). If the bars at the ends rise above the dotted curve, sharp days are more common than the simple model expects. <b>VaR</b> is the worst expected daily loss at 95% or 99% confidence, <b>CVaR</b> is the average loss on days worse than that, and <b>max drawdown</b> is the biggest fall from a peak to a trough.",
"help.rs.tests":"Tests that describe how the price behaves:<ul><li><b>ADF:</b> does the price “return” to a fixed level or wander freely? (non-stationary = wanders)</li><li><b>Ljung–Box:</b> is today's move influenced by previous days? On squared returns it reveals volatility clustering.</li><li><b>Variance ratio and Hurst:</b> do moves tend to continue or to snap back?</li></ul>A ✓ means a “normal” result; a ● means a note worth attention, not an error.",
"help.rs.vol":"Volatility is how much the price moves. EWMA and GARCH are two ways to estimate it from recent days. <b>Persistence</b> near 1 means calm or turbulence lasts long, and <b>half-life</b> is the number of days for half of any shock's effect to fade. The chart shows volatility gradually returning to its long-run level (blue line). “Current volatility rank” is the share of historical days with lower volatility than today.",
"help.rs.fan":"The fan shows how the possibilities widen over the coming days: the further out, the more uncertainty, so the fan widens. The dark line is the median, the darker area holds 80% of scenarios and the lighter one 90%. Pick the horizon (5 to 63 days). Scenarios are drawn from real days in gold's history, so they keep its true character.",
"help.rs.reg":"We try to explain the gold price with real yield, the dollar index and VIX (the fear index).<ul><li><b>β:</b> the factor's effect size. <b>t and p:</b> is the effect real? (p below 0.05 usually means yes).</li><li><b>R²:</b> the share explained by the model (1 = everything).</li><li><b>Spurious relationships:</b> two series that wander freely can look strongly related by coincidence. That is why we also show the changes regression, and the Engle–Granger test says whether the levels relationship is real.</li></ul>",
"help.rs.corr":"Correlation is a number between -1 and +1: near +1 means two things move together, near -1 means opposite, near 0 means unrelated. The matrix compares gold with the dollar, real yield and VIX. The chart shows how the relationship changes over time (60-day window); it is not constant.",
"help.rs.comp":"One index between -1 and +1 that combines several views: overall trend, momentum, RSI (did the price rise too fast?), distance from the average, volatility level and fair value. Each factor has a weight and a score. Above +0.25 is positive, below -0.25 is negative, otherwise neutral. It is a statistical summary, not advice.",

// حالة الاتصال: fetching | ok | stale | off

};
const renderLiveBadge = () => {

const upsertToday = (live) => {
  const d = todayISO(), dow = new Date().getUTCDay(); if (dow === 0 || dow === 6 || !live || !(live.price > 0)) return;
  const rows = loadData().slice(), i = rows.findIndex(r => r.date === d), prev = rows[rows.length - 1] || {};
  const base = { date: d, gold: +live.price.toFixed(2), sar: live.sar || prev.sar || SAR_PEG, egp: live.egp || prev.egp || null };
  if (i >= 0) rows[i] = { ...rows[i], gold: base.gold, sar: base.sar, egp: base.egp };
  else { rows.push({ ...base, realYield: prev.realYield ?? null, dxy: prev.dxy ?? null, vix: prev.vix ?? null }); rows.sort((a, b) => a.date < b.date ? -1 : 1); }

const liveErrText = () => { const e = state.liveErr; if (!e) return ""; return (e.known ? t("live.errKnown", { k: e.known }) : t("live.errNone")) + (e.fx ? " " + t("live.fxOnly") : "") + " " + t("live.useManual") + (e.wait ? " " + t("live.retry", { s: e.wait, n: e.n }) : ""); };
const srcName = (s) => (s === "manual" ? t("man.src") : s);
const applyManualLive = (price, sar, egp) => { saveLive({ price, sar, egp, updatedAt: new Date().toISOString(), fetchedAt: new Date().toISOString(), source: "manual", fxSource: "manual" }); state.liveErr = null; retryCount = 0; state.lastOk = Date.now(); state.lastFail = null; scheduleNext(); if (state.settings.autoRow) upsertToday(loadLive()); refreshAll(true); };

// تنفيذ الجلب الحي: مصادر متعددة + إعادة محاولة + الرجوع لآخر سعر معروف
const fetchLiveNow = async () => {
  if (state.fetching) return; state.fetching = true; renderLiveBadge();
  const msg = (...parts) => setMsg("fetchMsg", parts, parts[0] && parts[0][0] === "live.fetching");
  msg(["live.fetching"]); state.fetchLog = []; renderFetchLog();
  const prevLive = loadLive() || {};
  const [g, f] = await Promise.allSettled([raceSources(GOLD_SOURCES, "gold"), raceSources(FX_SOURCES, "fx")]);
  const gold = g.status === "fulfilled" ? g.value : null; let fx = f.status === "fulfilled" ? f.value : null;
  if (!fx && gold && gold.sar && gold.egp) fx = { sar: gold.sar, egp: gold.egp, source: gold.source };
  const now = new Date().toISOString();
  if (gold) {
    const live = { price: gold.price, updatedAt: gold.updatedAt || now, source: gold.source, sar: fx ? fx.sar : prevLive.sar, egp: fx ? fx.egp : prevLive.egp, fxSource: fx ? fx.source : (prevLive.fxSource || null), fetchedAt: now };
    saveLive(live);
    $("fDate").value = todayISO(); $("fGold").value = gold.price.toFixed(2); if (live.sar) $("fSar").value = (+live.sar).toFixed(4); if (live.egp) $("fEgp").value = (+live.egp).toFixed(4);
    if (state.settings.autoRow) upsertToday(live);
    fx ? msg(["live.done", { p: fmt(gold.price), s: gold.source }]) : msg(["live.done", { p: fmt(gold.price), s: gold.source }], ["live.noFx"]);
    state.liveErr = null;
    retryCount = 0; state.lastOk = Date.now(); state.lastFail = null; scheduleNext();
  } else {
    if (fx && prevLive.price) saveLive({ ...prevLive, sar: fx.sar, egp: fx.egp, fxSource: fx.source, fetchedAt: now });
    const rows = loadData(), last = rows[rows.length - 1];
    const known = prevLive.price ? `${fmt(prevLive.price)} $ · ${String(prevLive.updatedAt || "").slice(0, 10)}` : (last ? `${fmt(+last.gold)} $ · ${last.date}` : null);
    state.lastFail = Date.now(); retryCount++;
    const wait = retryCount <= 3 ? 20000 * retryCount : 0;
    state.liveErr = { known, fx: !!fx, wait: wait / 1000, n: retryCount };
    if (wait) scheduleNext(wait); else scheduleNext();
    msg(["live.failed"]);
  }
  state.fetching = false; refreshAll(true);
};

// ===================== البيانات التاريخية (حتى 5–10 سنوات) =====================
const yahooPts = async (sym, range) => {

  const d = await fetchWithProxy(url, { timeout: 15000 });
  const r = d.chart && d.chart.result && d.chart.result[0]; if (!r || !r.timestamp) throw new Error("shape");
  const c = r.indicators.quote[0].close, byDate = new Map();
  r.timestamp.forEach((ts, i) => { const v = c[i]; if (v > 0 && isFinite(v)) byDate.set(new Date(ts * 1000).toISOString().slice(0, 10), v); });
  return [...byDate.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
};
const rangeYears = (r) => parseInt(r, 10) || 5;
const stooqPts = async (sym, range) => {
  const d2 = new Date(), d1 = new Date(); d1.setFullYear(d1.getFullYear() - rangeYears(range));
  const f = (d) => d.toISOString().slice(0, 10).replace(/-/g, "");
  const text = await fetchWithProxy(`https://stooq.com/q/d/l/?s=${sym}&i=d&d1=${f(d1)}&d2=${f(d2)}`, { as: "text", proxyFirst: true, timeout: 15000 });
  const pts = text.trim().split(/\r?\n/).slice(1).map(l => l.split(",")).map(c => [c[0], parseFloat(c[4])]).filter(([dt, v]) => /^\d{4}-\d\d-\d\d$/.test(dt) && v > 0);
  if (pts.length < 20) throw new Error("shape"); return pts;
};
const fredPts = async (id, range) => {
  const d1 = new Date(); d1.setFullYear(d1.getFullYear() - rangeYears(range));
  const text = await fetchWithProxy(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}&cosd=${d1.toISOString().slice(0, 10)}`, { as: "text", proxyFirst: true, timeout: 15000 });
  const pts = text.trim().split(/\r?\n/).slice(1).map(l => l.split(",")).map(c => [c[0], parseFloat(c[1])]).filter(([dt, v]) => /^\d{4}-\d\d-\d\d$/.test(dt) && isFinite(v));

};
const firstOk = async (fns, min = 20) => { let last; for (const f of fns) { try { const p = await f(); if (p.length >= min) return p; } catch (e) { last = e; } } throw last || new Error("no source"); };
// إزالة القفزات الشاذة المعكوسة (قراءات خاطئة)
const despike = (pts) => pts.filter((p, i) => { if (i === 0 || i === pts.length - 1) return true; const a = pts[i - 1][1], b = p[1], c = pts[i + 1][1]; return !(Math.abs(Math.log(b / a)) > 0.08 && Math.abs(Math.log(c / a)) < 0.03); });
// دمج السلاسل على تواريخ الذهب مع ملء الأمام للقيم المفقودة
const mergeHistory = (goldPts, series) => {
  const ptr = {}, last = {}; Object.keys(series).forEach(k => { ptr[k] = 0; last[k] = null; });
  return goldPts.map(([date, gold]) => {
    const row = { date, gold: +gold.toFixed(2) };
    for (const k of Object.keys(series)) { const s = series[k]; while (ptr[k] < s.length && s[ptr[k]][0] <= date) { last[k] = s[ptr[k]][1]; ptr[k]++; } row[k] = last[k] === null ? (k === "sar" ? SAR_PEG : null) : +(+last[k]).toFixed(4); }
    return row;
  });
};
const HIST_STEPS = ["gold", "sar", "egp", "dxy", "vix", "ry"];
const renderHistSteps = () => {
  const el = $("histSteps"); if (!el) return; const st = state.hist;
  el.innerHTML = st ? HIST_STEPS.map(k => { const s = st[k] || { s: "wait" }; const ic = { wait: "○", run: '<span class="spin"></span>', ok: "✓", fail: "✗" }[s.s]; const col = { ok: "var(--good)", fail: "var(--bad)" }[s.s] || "var(--ink-2)"; return `<li style="color:${col}">${ic} ${t("hist.s." + k)}${s.note ? ` <span class="faint">(${escHtml(t(s.note))})</span>` : ""}</li>`; }).join("") : "";
};
let histBusy = false;
async function downloadHistory(range, { silent = false } = {}) {
  if (histBusy) return; histBusy = true; lsSet(HISTTRY_KEY, String(Date.now()));
  const st = {}; HIST_STEPS.forEach(k => { st[k] = { s: "wait" }; }); state.hist = st; renderHistSteps(); $("btnHist").disabled = true; setMsg("histMsg", [["hist.running"]], true);
  const set = (k, s, note) => { st[k] = { s, note }; renderHistSteps(); };
  const run = async (k, fn) => { set(k, "run"); try { const p = await fn(); set(k, "ok", p.length + ""); return p; } catch (e) { set(k, "fail", errMsg(e)); return null; } };
  const gold = await run("gold", () => firstOk([() => yahooPts("XAUUSD=X", range), () => yahooPts("GC=F", range), () => stooqPts("xauusd", range)]).then(despike));
  if (!gold) { setMsg("histMsg", [["hist.failed"]]); if (!silent) toast(t("hist.failed")); histBusy = false; $("btnHist").disabled = false; return; }
  const series = {};
  series.sar = await run("sar", () => firstOk([() => yahooPts("SAR=X", range), () => stooqPts("usdsar", range)], 5));
  series.egp = await run("egp", () => firstOk([() => yahooPts("EGP=X", range), () => stooqPts("usdegp", range)], 5));
  series.dxy = await run("dxy", () => firstOk([() => yahooPts("DX-Y.NYB", range), () => stooqPts("dx.f", range)], 5));
  series.vix = await run("vix", () => firstOk([() => yahooPts("^VIX", range)], 5));
  series.realYield = await run("ry", () => firstOk([() => fredPts("DFII10", range)], 5));
  Object.keys(series).forEach(k => { if (!series[k]) delete series[k]; });
  const rows = mergeHistory(gold, series), map = new Map(rows.map(r => [r.date, r]));
  loadData().forEach(r => { const d = map.get(r.date) || {}; const o = { ...d }; Object.keys(r).forEach(k => { if (r[k] !== null && r[k] !== undefined && r[k] !== "") o[k] = r[k]; }); map.set(r.date, o); });

}

// ===================== الحسابات المركبة =====================
const runSimulation = () => {
  const ref = currentRef(), s = state.settings;
  state.sigmaInfo = estimateSigma(ref.rowsV, s);
  state.S0 = ref.price; state.S0usd = ref.priceUsd; state.fx = { sar: ref.sar, egp: ref.egp, now: ref.fxNow };
  if (!ref.price) { state.mc = null; return; }
  const t0 = performance.now();
  state.mc = monteCarlo(ref.price, state.sigmaInfo.sigma, s.mu, s.nu, Math.round(s.nSims));
  state.mcMs = performance.now() - t0;
};
// القيمة العادلة بالدولار/أونصة (نموذج عالمي)، ونسبة العدالة بالدولار، ومعادلها بعملة العرض
const currentFair = () => {
  const s = state.settings, v = s.fvInputs, fv = fairValue(+v.realYield, +v.dxy, +v.cbFlows, +v.geoIndex, s.coeffs);
  const ratio = (state.S0usd && fv > 0) ? state.S0usd / fv : NaN, fx = currentRef().fxNow;
  return { fv, ratio, cls: classifyFairness(ratio), fvView: (fv > 0 && fx) ? toView(fv, fx, s) : null };
};
const fmtV = (x) => fmt(x, state.settings.unit === "g" ? 2 : 1);
// إشارة التداول: العدالة + موقع السعر من نطاق الأمس + الانحياز اليدوي
const tradingSignal = () => {
  const reasons = []; let score = 0; const fair = currentFair(), r = isFinite(fair.ratio) ? fair.ratio.toFixed(3) : "";
  if (isFinite(fair.ratio)) {
    if (fair.ratio < 0.85) { score += 1; reasons.push(t("sg.under", { r })); }
    else if (fair.ratio > 1.15) { score -= 1; reasons.push(t("sg.over", { r })); }
    else if (fair.ratio < 0.95) { score += 0.5; reasons.push(t("sg.fairCheap", { r })); }
    else if (fair.ratio > 1.05) { score -= 0.5; reasons.push(t("sg.fairRich", { r })); }
    else reasons.push(t("sg.fair", { r }));
  } else reasons.push(t("sg.noFair"));
  const ref = currentRef(), s = state.settings;
  if (ref.price && ref.prev) {
    const sameDay = ref.source === "live" && ref.last && String(ref.live.updatedAt).slice(0, 10) === ref.last.date;
    const rowsPrev = (ref.source === "live" && ref.last && !sameDay) ? ref.rowsV : ref.rowsV.slice(0, -1);
    const sg = estimateSigma(rowsPrev, s, { ewmaOnly: true }).sigma, q = tStdQuantiles(s.nu);
    const b = { p5: bandAt(ref.prev, sg, BASE_MU, q[0.05]), p10: bandAt(ref.prev, sg, BASE_MU, q[0.1]), p90: bandAt(ref.prev, sg, BASE_MU, q[0.9]), p95: bandAt(ref.prev, sg, BASE_MU, q[0.95]) };
    if (ref.price > b.p95) { score -= 1; reasons.push(t("sg.aboveP95", { v: fmt(b.p95) })); }
    else if (ref.price > b.p90) { score -= 0.5; reasons.push(t("sg.aboveP90", { v: fmt(b.p90) })); }
    else if (ref.price < b.p5) { score += 1; reasons.push(t("sg.belowP5", { v: fmt(b.p5) })); }
    else if (ref.price < b.p10) { score += 0.5; reasons.push(t("sg.belowP10", { v: fmt(b.p10) })); }
    else reasons.push(t("sg.inside", { a: fmt(b.p10), b: fmt(b.p90) }));
  } else reasons.push(t("sg.noPrev"));
  if (Math.abs(s.mu) >= 0.001) { const m = s.mu > 0 ? 0.5 : -0.5; score += m; reasons.push(t(s.mu > 0 ? "sg.muUp" : "sg.muDown")); }
  const sig = score >= 1 ? { label: t("sg.buy"), en: "BUY", color: "var(--good)", icon: "▲" } : score <= -1 ? { label: t("sg.sell"), en: "SELL", color: "var(--bad)", icon: "▼" } : { label: t("sg.hold"), en: "HOLD", color: "var(--neutral)", icon: "●" };
  return { ...sig, score, reasons };
};
// الاختبار الرجعي (EWMA): نطاق P10–P90 لكل يوم من بيانات اليوم السابق فقط
const runBacktest = (mult = state.settings.sigmaMult) => {
  const rows = viewRows(), s = state.settings, r = logReturns(rows), q = tStdQuantiles(s.nu), pts = [];
  for (let i = 6; i < rows.length; i++) {
    const hist = r.slice(Math.max(0, i - 1 - 30), i - 1); if (hist.length < 5) continue;
    const sg = ewmaSigma(hist, s.lambda) * mult, S0 = +rows[i - 1].gold, St = +rows[i].gold;

    pts.push({ date: rows[i].date, price: St, lo, hi, hit: St < lo || St > hi ? 1 : 0, below: St < lo, above: St > hi });
  }

  const sec = (title, body, sub, hk) => `<div class="card p-4"><h2 class="font-bold mb-1">${title}</h2>${sub ? `<p class="text-xs faint mb-1">${sub}</p>` : ""}${hk ? helpHtml(hk) : '<div class="mb-2"></div>'}${body}</div>`;
  const parts = [];

  parts.push(`<div class="card p-4"><div class="flex flex-wrap items-center justify-between gap-2"><div><h2 class="font-bold">${t("rs.title")}</h2><p class="text-xs faint">${t("rs.sub", { n: R.n, a: R.from, b: R.to, ms: R.ms.toFixed(0) })}</p><p class="text-xs muted mt-1">${t("rs.viewNote", { c: MARKETS[vs.market].cur, u: t("unit." + vs.unit), k: vs.karat, b: t("st.basis." + vs.basis) })}</p></div><button class="btn" id="rsRecalc">${t("rs.recalc")}</button></div>${R.n < 250 ? `<p class="banner banner-warn mt-3 text-sm">${t("rs.few")}</p>` : ""}</div>`);
  // 1) التوزيع

  parts.push(sec(t("rs.dist"), `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${statBox(t("rs.meanAnn"), pct(d.meanAnn, 1), t("rs.logRet"))}${statBox(t("rs.volAnn"), pct(d.volAnn, 1), "σ·√252")}${statBox(t("rs.skew"), d.skew.toFixed(2), d.skew < -0.2 ? t("rs.negSkew") : d.skew > 0.2 ? t("rs.posSkew") : t("rs.symm"))}${statBox(t("rs.kurt"), d.kurt.toFixed(2), d.kurt > 1 ? t("rs.fat") : t("rs.thin"))}
    ${statBox("VaR 95% (1d)", pct(d.var95.var, 2), `CVaR ${pct(d.var95.cvar, 2)}`)}${statBox("VaR 99% (1d)", pct(d.var99.var, 2), `CVaR ${pct(d.var99.cvar, 2)}`)}${statBox(t("rs.mdd"), pct(d.mdd, 1), t("rs.mddSub"))}${statBox("JB p-value", pv(d.jb.p), d.jb.p < 0.05 ? t("rs.notNormal") : t("rs.normalOk"))}</div><div class="chart-box" style="height:240px"><canvas id="chartRetHist"></canvas></div>`, t("rs.dist.sub"), "help.rs.dist"));
  // 2) اختبارات
  const rowT = (name, stat, p, vd) => `<tr><td>${name}</td><td><span class="num">${stat}</span></td><td><span class="num">${p}</span></td><td>${vd}</td></tr>`;

  if (T.adfR) trs.push(rowT(t("rs.adfR"), T.adfR.stat.toFixed(2), `${T.adfR.crit[5]} (5%)`, verdict(T.adfR.reject5, t("rs.stationary"), t("rs.unitRoot"))));
  trs.push(rowT(t("rs.lb"), T.lb.Q.toFixed(1), pv(T.lb.p), verdict(T.lb.p > 0.05, t("rs.noAc"), t("rs.ac"))));
  trs.push(rowT(t("rs.lb2"), T.lb2.Q.toFixed(1), pv(T.lb2.p), verdict(T.lb2.p > 0.05, t("rs.noArch"), t("rs.arch"))));
  if (T.vr5) trs.push(rowT("VR(5)", T.vr5.VR.toFixed(3), pv(T.vr5.p), verdict(T.vr5.p > 0.05, t("rs.rw"), T.vr5.VR > 1 ? t("rs.mom") : t("rs.mr"))));
  if (T.vr20) trs.push(rowT("VR(20)", T.vr20.VR.toFixed(3), pv(T.vr20.p), verdict(T.vr20.p > 0.05, t("rs.rw"), T.vr20.VR > 1 ? t("rs.mom") : t("rs.mr"))));
  if (T.hurst !== null) trs.push(rowT(t("rs.hurst"), T.hurst.toFixed(3), "≈0.55 iid", verdict(T.hurst > 0.42 && T.hurst < 0.62, t("rs.rw"), T.hurst >= 0.62 ? t("rs.persist") : t("rs.antiP"))));
  parts.push(sec(t("rs.tests"), `<div class="overflow-x-auto"><table class="tbl"><thead><tr><th>${t("ch.test")}</th><th>${t("rs.stat")}</th><th>p / ${t("rs.crit")}</th><th>${t("ch.result")}</th></tr></thead><tbody>${trs.join("")}</tbody></table></div>`, t("rs.tests.sub"), "help.rs.tests"));
  // 3) نماذج التقلب
  if (g) {
    const gr = (m, name) => m ? `<tr><td>${name}</td><td><span class="num">${m.alpha.toFixed(3)}</span></td><td><span class="num">${m.beta.toFixed(3)}</span></td><td><span class="num">${m.gamma ? m.gamma.toFixed(3) : "—"}</span></td><td><span class="num">${m.persistence.toFixed(3)}</span></td><td><span class="num">${isFinite(m.halfLife) ? m.halfLife.toFixed(0) : "∞"}</span></td><td><span class="num">${pct(m.sigmaNext * ann, 1)}</span></td><td><span class="num">${pct(m.longRunSigma * ann, 1)}</span></td><td><span class="num">${m.aic.toFixed(0)}</span></td></tr>` : "";
    parts.push(sec(t("rs.vol"), `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${statBox("EWMA σ", pct(R.ewma * ann, 1), t("rs.ann") + " · λ=" + state.settings.lambda)}${statBox("GARCH σ", pct(g.sigmaNext * ann, 1), t("rs.ann"))}${statBox(t("rs.longRun"), pct(g.longRunSigma * ann, 1), t("rs.ann"))}${statBox(t("rs.volPct"), pct(R.volPct, 0), R.volPct > 0.8 ? t("rs.hiVol") : R.volPct < 0.3 ? t("rs.loVol") : t("rs.midVol"))}</div>
      <div class="overflow-x-auto mb-3"><table class="tbl"><thead><tr><th>${t("rs.model")}</th><th>α</th><th>β</th><th>γ</th><th>${t("rs.persistence")}</th><th>${t("rs.half")}</th><th>σ ${t("rs.next")}</th><th>${t("rs.longRun")}</th><th>AIC</th></tr></thead><tbody>${gr(g, "GARCH(1,1)")}${gr(gj, "GJR-GARCH")}</tbody></table></div>
      <div class="flex flex-wrap items-center gap-3 mb-3"><span class="text-sm muted">${t("rs.nuEst")}: <b class="num">${R.nuEst.toFixed(1)}</b></span><button class="btn" id="rsApplyNu">${t("rs.applyNu")}</button><button class="btn" id="rsUseGarch">${t("rs.useGarch")}</button></div>
      <div class="chart-box" style="height:220px"><canvas id="chartVolTerm"></canvas></div>`, t("rs.vol.sub"), "help.rs.vol"));
    // 4) مخروط التنبؤ FHS
    parts.push(sec(t("rs.fan"), `<div class="flex flex-wrap items-center gap-3 mb-3"><span class="text-sm muted">${t("rs.horizon")}</span><div class="seg" id="fanBtns">${[5, 10, 21, 63].map(h => `<button data-h="${h}" aria-pressed="${h === fanH}">${h}d</button>`).join("")}</div></div><div class="chart-box" style="height:280px"><canvas id="chartFan"></canvas></div><div class="overflow-x-auto mt-3"><table class="tbl" id="fanTable"></table></div>`, t("rs.fan.sub"), "help.rs.fan"));
  }
  // 5) الانحدار
  const regTbl = (m, title, fmtB) => m ? `<h3 class="font-semibold text-sm mb-1">${title}</h3><div class="overflow-x-auto mb-2"><table class="tbl"><thead><tr><th>${t("rs.var")}</th><th>β</th><th>SE</th><th>t</th><th>p</th></tr></thead><tbody>${m.names.map((nm, i) => `<tr><td>${nm}</td><td><span class="num">${fmtB(m.beta[i])}</span></td><td><span class="num">${fmtB(m.se[i])}</span></td><td><span class="num">${m.tstat[i].toFixed(2)}</span></td><td><span class="num" style="color:${m.pval[i] < 0.05 ? "var(--good)" : "var(--ink-3)"}">${pv(m.pval[i])}</span></td></tr>`).join("")}</tbody></table></div><div class="text-xs muted mb-4">n=${m.n} · R²=${m.r2.toFixed(3)} · adj.R²=${m.adjR2.toFixed(3)} · DW=${m.dw.toFixed(2)} · σ<sub>ε</sub>=${fmtB(m.sigma)}</div>` : "";
  if (R.regLvl || R.regChg) {
    const eg = R.regLvl && R.regLvl.eg;
    parts.push(sec(t("rs.reg"), `${regTbl(R.regLvl, t("rs.regLvl"), (v) => v.toFixed(Math.abs(v) < 1 ? 4 : 2))}${eg ? `<div class="banner ${eg.reject5 ? "banner-good" : "banner-warn"} mb-3 text-sm">Engle–Granger: ${t("rs.stat")} <b class="num">${eg.stat.toFixed(2)}</b> ${t("rs.vs")} <span class="num">${eg.crit5}</span> (5%, ${t("rs.approx")}) — ${eg.reject5 ? "✓ " + t("rs.coint") : "● " + t("rs.noCoint")}${!eg.reject5 || R.regLvl.dw < 0.5 ? `<br>${t("rs.spurious")}` : ""}</div>` : ""}${regTbl(R.regChg, t("rs.regChg"), (v) => v.toFixed(Math.abs(v) < 0.01 ? 5 : 4))}${R.regLvl ? `<button class="btn btn-primary" id="rsApplyReg">${t("rs.applyReg")}</button><p class="text-xs faint mt-2">${t("rs.applyNote")}</p>` : ""}`, t("rs.reg.sub", { v: R.regVars.join(", ") }), "help.rs.reg"));
  } else parts.push(sec(t("rs.reg"), `<p class="text-sm muted">${t("rs.regNone")}</p>`));
  // 6) الارتباطات
  if (R.corr) {
    const C = R.corr; parts.push(sec(t("rs.corr"), `<div class="overflow-x-auto"><table class="tbl"><thead><tr><th></th>${C.names.map(n => `<th>${n}</th>`).join("")}</tr></thead><tbody>${C.names.map((n, i) => `<tr><td class="font-semibold">${n}</td>${C.m[i].map(v => `<td style="background:color-mix(in srgb, ${v >= 0 ? "var(--blue)" : "var(--bad)"} ${Math.round(Math.abs(v) * 55)}%, transparent)"><span class="num">${v.toFixed(2)}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div><div class="chart-box mt-3" style="height:220px"><canvas id="chartRoll"></canvas></div>`, t("rs.corr.sub"), "help.rs.corr"));
  }
  // 7) القراءة المركبة
  const tot = R.comp.total, lab = tot > 0.25 ? { l: t("rs.pos"), c: "var(--good)" } : tot < -0.25 ? { l: t("rs.neg"), c: "var(--bad)" } : { l: t("rs.neu"), c: "var(--neutral)" };
  parts.push(sec(t("rs.comp"), `<div class="flex items-center gap-3 mb-3"><span class="pill text-lg" style="color:${lab.c}">${lab.l}</span><span class="num font-bold">${tot >= 0 ? "+" : ""}${tot.toFixed(2)}</span><span class="text-xs faint">[-1, +1]</span></div><div class="overflow-x-auto"><table class="tbl"><thead><tr><th>${t("rs.factor")}</th><th>${t("rs.value")}</th><th>${t("rs.weight")}</th><th>${t("rs.score")}</th></tr></thead><tbody>${R.comp.items.map(c => `<tr><td>${t("rs.c." + c.k)}</td><td><span class="num">${c.val}</span></td><td><span class="num">${(c.w * 100).toFixed(0)}%</span></td><td><span class="num" style="color:${c.sc > 0.05 ? "var(--good)" : c.sc < -0.05 ? "var(--bad)" : "var(--ink-3)"}">${c.sc >= 0 ? "+" : ""}${c.sc.toFixed(2)}</span></td></tr>`).join("")}</tbody></table></div><p class="text-xs faint mt-2">${t("sg.disc")}</p>`, t("rs.comp.sub"), "help.rs.comp"));
  // 8) مقارنة رجعية
  if (R.bt) {
    const b = R.bt, better = Math.abs(b.garch.cov80 - 0.8) < Math.abs(b.ewma.cov80 - 0.8) ? "GARCH" : "EWMA";
    parts.push(sec(t("rs.bt"), `<div class="overflow-x-auto"><table class="tbl"><thead><tr><th>${t("rs.model")}</th><th>${t("rs.cov80")}</th><th>${t("rs.cov90")}</th><th>n</th></tr></thead><tbody>${["ewma", "garch"].map(k => `<tr><td>${k === "ewma" ? "EWMA" : "GARCH(1,1)"}</td><td><span class="num">${pct(b[k].cov80, 1)}</span> <span class="faint text-xs">(Δ ${((b[k].cov80 - 0.8) * 100).toFixed(1)}pp)</span></td><td><span class="num">${pct(b[k].cov90, 1)}</span> <span class="faint text-xs">(Δ ${((b[k].cov90 - 0.9) * 100).toFixed(1)}pp)</span></td><td><span class="num">${b[k].n}</span></td></tr>`).join("")}</tbody></table></div><p class="text-sm mt-2">${t("rs.btBest", { m: better })}</p>`, t("rs.bt.sub"), "help.rs.bt"));
  }
  // 9) خلاصة تفسيرية
  const I = [];
  I.push(d.jb.p < 0.05 ? t("in.fat", { k: d.kurt.toFixed(1) }) : t("in.normal"));
  if (T.adfP && !T.adfP.reject5) I.push(t("in.nonstat"));
  if (T.lb2.p < 0.05) I.push(t("in.arch"));
  if (T.hurst !== null) I.push(T.hurst >= 0.62 ? t("in.trend", { h: T.hurst.toFixed(2) }) : T.hurst <= 0.42 ? t("in.mr", { h: T.hurst.toFixed(2) }) : t("in.rw", { h: T.hurst.toFixed(2) }));
  if (T.vr20 && T.vr20.p < 0.05) I.push(T.vr20.VR > 1 ? t("in.vrMom") : t("in.vrMr"));
  if (g) { if (g.persistence > 0.97) I.push(t("in.persist", { p: g.persistence.toFixed(3), h: isFinite(g.halfLife) ? g.halfLife.toFixed(0) : "∞" })); I.push(R.volPct > 0.8 ? t("in.hiVol") : R.volPct < 0.3 ? t("in.loVol") : t("in.midVol")); if (gj && gj.gamma > 0.03) I.push(t("in.asym")); }
  if (R.regLvl && R.regLvl.eg) I.push(R.regLvl.eg.reject5 ? t("in.coint") : t("in.spur"));
  parts.push(`<div class="card p-4"><h2 class="font-bold mb-2">${t("rs.summary")}</h2><ul class="interp list-disc ps-5">${I.map(x => `<li>${x}</li>`).join("")}</ul></div>`);
  root.innerHTML = parts.join("");
  // أحداث
  $("rsRecalc").addEventListener("click", () => { researchMemo = { rows: null, sig: null, val: null }; garchMemo = { rows: null, val: null }; renderResearch(); });
  const an = $("rsApplyNu"); if (an) an.addEventListener("click", () => { state.settings.nu = +R.nuEst.toFixed(1); saveSettings(state.settings); refreshAll(true); toast(t("rs.nuApplied", { v: state.settings.nu })); });
  const ug = $("rsUseGarch"); if (ug) ug.addEventListener("click", () => { state.settings.volModel = "garch"; saveSettings(state.settings); refreshAll(true); toast(t("rs.garchOn")); });
  const ar = $("rsApplyReg"); if (ar) ar.addEventListener("click", () => {
    const m = R.regLvl, c = state.settings.coeffs, get = (n) => { const i = m.names.indexOf(n); return i >= 0 ? m.beta[i] : 0; };
    c.alpha = m.beta[0]; c.beta1 = get("RealYield"); c.beta2 = get("DXY"); c.beta3 = 0; c.beta4 = get("VIX");
    const lr = lastNonNull(rows, "realYield"), dx = lastNonNull(rows, "dxy"), vx = lastNonNull(rows, "vix"); const v = state.settings.fvInputs; if (lr !== null) v.realYield = lr; if (dx !== null) v.dxy = dx; if (vx !== null) v.geoIndex = vx; v.cbFlows = 0;
    saveSettings(state.settings); renderFairInputs(); refreshAll(false); toast(t("rs.regApplied"), 4500); });
  if (!window.Chart) return;
  // مدرج العوائد مع المنحنى الطبيعي ومنحنى t
  const lr = R.lr, m = mean(lr), sd = stdev(lr), bins = 41, lo = m - 5 * sd, hi = m + 5 * sd, w = (hi - lo) / bins, cnt = new Array(bins).fill(0);
  lr.forEach(x => { const i = Math.floor((x - lo) / w); if (i >= 0 && i < bins) cnt[i]++; });
  const cen = cnt.map((_, i) => lo + (i + 0.5) * w), dens = (x) => 1 / (sd * Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * ((x - m) / sd) ** 2) * w * lr.length;
  const nuU = Math.max(3.5, Math.min(30, R.nuEst || state.settings.nu)), scT = Math.sqrt(nuU / (nuU - 2)), tdens = (x) => { const z = (x - m) / sd * scT; const c = Math.exp(gammln((nuU + 1) / 2) - gammln(nuU / 2)) / Math.sqrt(nuU * Math.PI); return c * Math.pow(1 + z * z / nuU, -(nuU + 1) / 2) * scT / sd * w * lr.length; };
  state.charts.retHist = new Chart($("chartRetHist"), { data: { labels: cen.map(c => (c * 100).toFixed(1) + "%"), datasets: [
    { type: "bar", label: t("rs.empirical"), data: cnt, backgroundColor: cssVar("--gold-band-80"), borderRadius: 2, barPercentage: 1, categoryPercentage: 0.95, order: 3 },
    { type: "line", label: t("rs.normalCurve"), data: cen.map(dens), borderColor: cssVar("--ink-3"), borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0, tension: 0.3, order: 2 },
    { type: "line", label: `t (ν=${nuU.toFixed(1)})`, data: cen.map(tdens), borderColor: cssVar("--blue"), borderWidth: 2, pointRadius: 0, tension: 0.3, order: 1 }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 12 } }, tooltip: baseTooltip() }, scales: { x: { reverse: isRTL(), grid: { display: false }, ticks: { maxTicksLimit: 9 } }, y: { display: false } } } });
  if (g) {
    const H = 60, hs = Array.from({ length: H }, (_, i) => i + 1);
    state.charts.volTerm = new Chart($("chartVolTerm"), { type: "line", data: { labels: hs, datasets: [
      { label: "GARCH", data: hs.map(h => Math.sqrt(g.termVar(h)) * ann * 100), borderColor: cssVar("--gold"), borderWidth: 2.2, pointRadius: 0 },
      { label: "EWMA", data: hs.map(() => R.ewma * ann * 100), borderColor: cssVar("--ink-3"), borderDash: [5, 4], borderWidth: 1.6, pointRadius: 0 },
      { label: t("rs.longRun"), data: hs.map(() => g.longRunSigma * ann * 100), borderColor: cssVar("--blue"), borderDash: [2, 3], borderWidth: 1.4, pointRadius: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "bottom", labels: { boxWidth: 12 } }, tooltip: { ...baseTooltip(), callbacks: { title: (it) => `${it[0].label}d`, label: (c) => ` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}%` } } }, scales: { x: { reverse: isRTL(), grid: { display: false }, ticks: { maxTicksLimit: 10 } }, y: { position: yPos(), title: { display: true, text: t("rs.annVolPct") }, ticks: { callback: (v) => v + "%" } } } } });
    const drawFan = () => {
      destroyChart("fan"); const fan = fhsFan(S0, g, mu, fanH, 4000), labels = ["0", ...fan.map((_, i) => String(i + 1))], b90 = cssVar("--gold-band-90"), b80 = cssVar("--gold-band-80");
      const col = (k) => [S0, ...fan.map(f => f[k])];
      state.charts.fan = new Chart($("chartFan"), { type: "line", data: { labels, datasets: [
        { order: 5, label: "P95", data: col("p95"), borderColor: b90, backgroundColor: b90, borderWidth: 1, pointRadius: 0, fill: "+1" },
        { order: 4, label: "P90", data: col("p90"), borderColor: b80, backgroundColor: b80, borderWidth: 1, pointRadius: 0, fill: "+1" },
        { order: 3, label: "P50", data: col("p50"), borderColor: cssVar("--gold-mid"), borderWidth: 2, pointRadius: 0, fill: false },
        { order: 2, label: "P10", data: col("p10"), borderColor: b80, backgroundColor: b80, borderWidth: 1, pointRadius: 0, fill: "-1" },
        { order: 1, label: "P5", data: col("p5"), borderColor: b90, backgroundColor: b90, borderWidth: 1, pointRadius: 0, fill: "-1" }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "bottom", labels: { boxWidth: 12 } }, tooltip: { ...baseTooltip(), callbacks: { title: (it) => `${t("rs.day")} ${it[0].label}`, label: (c) => ` ${c.dataset.label}: ${fmt(c.parsed.y)}` } } }, scales: { x: { reverse: isRTL(), grid: { display: false }, ticks: { maxTicksLimit: 9 } }, y: { position: yPos(), title: { display: true, text: ut }, ticks: { callback: (v) => fmt(v, vs.unit === "g" ? 1 : 0) } } } } });
      const fl = fan[fan.length - 1];
      $("fanTable").innerHTML = `<thead><tr><th>${t("rs.day")} ${fanH}</th>${["P5", "P10", "P50", "P90", "P95"].map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody><tr><td>${ut}</td>${["p5", "p10", "p50", "p90", "p95"].map(k => `<td><span class="num">${fmt(fl[k])}</span></td>`).join("")}</tr><tr><td>%</td>${["p5", "p10", "p50", "p90", "p95"].map(k => `<td><span class="num" style="color:${fl[k] >= S0 ? "var(--good)" : "var(--bad)"}">${fl[k] >= S0 ? "+" : ""}${pct(fl[k] / S0 - 1, 1)}</span></td>`).join("")}</tr></tbody>`;
    };
    drawFan();
    document.querySelectorAll("#fanBtns button").forEach(b => b.addEventListener("click", () => { fanH = +b.dataset.h; document.querySelectorAll("#fanBtns button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); drawFan(); }));
  }
  if (R.roll && (R.roll.dxy || R.roll.ry)) {
    const base = R.roll.dxy || R.roll.ry, ds = [];
    if (R.roll.dxy) ds.push({ label: "Gold–DXY", data: R.roll.dxy.v, borderColor: cssVar("--gold"), borderWidth: 2, pointRadius: 0 });
    if (R.roll.ry) ds.push({ label: "Gold–ΔRealYield", data: R.roll.ry.v, borderColor: cssVar("--blue"), borderWidth: 2, pointRadius: 0 });
    state.charts.roll = new Chart($("chartRoll"), { type: "line", data: { labels: base.dates, datasets: ds }, options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: "index", intersect: false }, plugins: { legend: { position: "bottom", labels: { boxWidth: 12 } }, tooltip: { ...baseTooltip(), callbacks: { label: (c) => ` ${c.dataset.label}: ${c.parsed.y.toFixed(2)}` } } }, scales: { x: { reverse: isRTL(), grid: { display: false }, ticks: { maxTicksLimit: 7, callback: function (v) { return this.getLabelForValue(v).slice(0, 7); } } }, y: { position: yPos(), min: -1, max: 1 } } } });
  }
};
